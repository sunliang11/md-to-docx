name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build template assets
        run: |
          pip install markdown-it-py mdit-py-plugins python-docx latex2mathml pillow
          PYTHONPATH=scripts python -m md_to_docx.presets_build
      - name: Install package (dev)
        run: pip install -e ".[dev,mcp,web]"
      - name: Native tests (no pandoc)
        run: |
          pytest tests/test_ast.py tests/test_parse_frontmatter.py tests/test_parse_markdown.py \
            tests/test_native_docx.py tests/test_native_no_pandoc.py tests/test_parse_containers.py \
            tests/test_toc.py tests/test_cjk.py tests/test_preset.py tests/test_validate.py \
            tests/test_examples_smoke.py tests/test_api.py tests/test_mcp.py tests/test_web_api.py \
            tests/test_parse_docx.py tests/test_write_markdown.py tests/test_diff.py \
            tests/test_roundtrip.py tests/test_plugin_loader.py tests/test_callout.py \
            tests/test_render_html.py -v

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build template assets
        run: |
          pip install markdown-it-py mdit-py-plugins python-docx latex2mathml pillow
          PYTHONPATH=scripts python -m md_to_docx.presets_build

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,mcp,web]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify MCP entry
        run: python -m md_to_docx.mcp --help

      - name: Verify bin/convert entry point
        run: ./bin/convert --help

      - name: Verify --version flag
        run: python -m md_to_docx --version

      - name: Verify --help flag
        run: python -m md_to_docx --help

      - name: Sample conversion and XML assertions
        run: |
          python -m md_to_docx tests/fixtures/sample.md --engine pandoc
          python -m md_to_docx tests/fixtures/comprehensive.md --engine pandoc
          
          # Verify output files exist and are not empty
          test -f tests/fixtures/sample.docx
          test -f tests/fixtures/comprehensive.docx
          test -s tests/fixtures/sample.docx
          test -s tests/fixtures/comprehensive.docx
          
          echo "✓ Sample conversions succeeded and produced non-empty output"

      - name: Convert examples (native)
        run: |
          bash scripts/demo/build_examples.sh
          for f in examples/*/example.docx; do test -s "$f"; done

      - name: Validate GitHub Action (local)
        run: |
          pip install -e .
          md-to-docx examples/meeting-notes/example.md --preset technical --output-dir dist/docx
          test -s dist/docx/example.docx

      - name: Validate plugin example
        run: |
          md-to-docx tests/fixtures/sample.md \
            --plugin examples/plugins/uppercase_headings.py \
            --output-dir /tmp/p3b-plugin-test
          test -s /tmp/p3b-plugin-test/sample.docx

      - name: Validate community templates
        run: |
          for f in templates/*/sample.md; do
            dir=$(dirname "$f")
            name=$(basename "$f" .md)
            md-to-docx "$f" --template "$dir/template.docx" --output-dir /tmp/templates-test
            test -s "/tmp/templates-test/${name}.docx"
          done

      - name: Validate editor manifests
        run: |
          python -m json.tool editors/vscode/package.json > /dev/null
          python -m json.tool editors/obsidian/manifest.json > /dev/null

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extension adapter tests
        run: |
          cd browser-extension
          npm install
          npm test
