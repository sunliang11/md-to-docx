[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2docx-compiler"
version = "1.1.0"
description = "The open-source document compiler for the AI era. Markdown / AI output → professional DOCX."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "md-to-docx contributors" }]
keywords = ["markdown", "docx", "word", "pandoc", "ai", "document-compiler", "mermaid", "wecom"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "python-docx>=1.0",
    "latex2mathml>=3.0",
    "lxml>=4.9",
]

[project.urls]
Homepage = "https://github.com/sunliang11/md-to-docx"
Documentation = "https://github.com/sunliang11/md-to-docx#readme"
Issues = "https://github.com/sunliang11/md-to-docx/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=10.0"]
mcp = ["mcp>=1.0"]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "httpx>=0.24"]

[project.scripts]
md-to-docx = "md_to_docx.cli:main"
md-to-docx-mcp = "md_to_docx.mcp.server:main"

[tool.hatch.build]
dev-mode-dirs = ["scripts"]

[tool.hatch.build.targets.wheel]
packages = ["scripts/md_to_docx"]

[tool.hatch.build.targets.wheel.force-include]
"assets/wecom-layout.lua" = "md_to_docx/data/wecom-layout.lua"
"assets/reference-wecom.docx" = "md_to_docx/data/reference-wecom.docx"
"assets/reference-native.docx" = "md_to_docx/data/reference-native.docx"
"assets/presets/professional.docx" = "md_to_docx/data/presets/professional.docx"
"assets/presets/technical.docx" = "md_to_docx/data/presets/technical.docx"
"assets/presets/academic.docx" = "md_to_docx/data/presets/academic.docx"
"assets/presets/business.docx" = "md_to_docx/data/presets/business.docx"
"assets/presets/report.docx" = "md_to_docx/data/presets/report.docx"

[tool.hatch.build.targets.sdist]
include = [
    "/scripts",
    "/tests",
    "/assets",
    "/references",
    "/README.md",
    "/SKILL.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "mermaid: needs mmdc on PATH",
]
