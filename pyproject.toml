[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-to-docx"
version = "0.1.0"
description = "The open-source document compiler for the AI era. Markdown / AI output → professional DOCX."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "md-to-docx contributors" }]
keywords = ["markdown", "docx", "word", "pandoc", "ai", "document-compiler", "mermaid", "wecom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/sunliang11/md-to-docx"
Documentation = "https://github.com/sunliang11/md-to-docx#readme"
Issues = "https://github.com/sunliang11/md-to-docx/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "python-docx>=1.0", "lxml>=6.1.2", "pillow>=10.0"]

[project.scripts]
md-to-docx = "md_to_docx.cli:main"
md-to-docx-build-reference = "md_to_docx.reference:main"

[tool.hatch.build]
dev-mode-dirs = ["scripts"]

[tool.hatch.build.targets.wheel]
packages = ["scripts/md_to_docx"]

[tool.hatch.build.targets.wheel.force-include]
"assets/wecom-layout.lua" = "md_to_docx/data/wecom-layout.lua"
"assets/reference-wecom.docx" = "md_to_docx/data/reference-wecom.docx"

[tool.hatch.build.targets.sdist]
include = [
    "/scripts",
    "/tests",
    "/assets",
    "/references",
    "/README.md",
    "/SKILL.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
