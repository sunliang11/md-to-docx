[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-to-docx"
version = "0.1.0"
description = "Convert Markdown to DOCX for WeCom smart-doc import (pandoc + mermaid-cli)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "md-to-docx contributors" }]
keywords = ["markdown", "docx", "pandoc", "wecom", "mermaid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "python-docx>=1.0"]

[project.scripts]
md-to-docx = "md_to_docx.cli:main"
md-to-docx-build-reference = "md_to_docx.reference:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/md_to_docx"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
